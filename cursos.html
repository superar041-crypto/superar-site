<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cursos técnicos EAD – Superar</title>
  <meta name="description" content="Conheça os 22 cursos técnicos EAD da Superar: gestão, comunicação, tecnologia, indústria, agro e saúde.">
  <link rel="icon" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="cursos">

<main>
  <section class="page-hero aurora">
    <div class="wrap">
      <span class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5V21h16"/></svg>Cursos técnicos</span>
      <h1>Todos os cursos da Superar<br> <span class="suave">num só lugar.</span></h1>
      <p>Formação técnica com aulas EAD e aulas presenciais. Escolha o curso, confira a grade e faça sua matrícula e inscrição 100% online.</p>
    </div>
  </section>

  <section class="section" style="padding-top:40px">
    <div class="wrap">
      <div class="filtros" id="filtros" role="group" aria-label="Filtrar por área"></div>
      <div class="grid-cursos" id="lista"></div>
      <p id="vazio" class="muted" hidden>Nenhum curso encontrado.</p>
    </div>
  </section>
</main>

<script src="js/cursos-data.js"></script>
<script src="js/main.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  let area = params.get("area") || "Todos";
  let termo = "";
  const areas = ["Todos", ...new Set(CURSOS.map((c) => c.area))];
  const norm = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

  const filtros = document.getElementById("filtros");
  filtros.innerHTML = areas.map((a) => `<button class="chip" data-a="${esc(a)}" aria-pressed="${a === area}">${esc(a)}</button>`).join("") +
    `<label class="busca"><span class="sr-only">Buscar curso</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="search" placeholder="Buscar curso" id="q"></label>`;

  function render() {
    const lista = CURSOS.filter((c) => (area === "Todos" || c.area === area) && norm(c.nome).includes(norm(termo)));
    document.getElementById("lista").innerHTML = lista.map(cardCurso).join("");
    document.getElementById("vazio").hidden = lista.length > 0;
  }
  filtros.addEventListener("click", (e) => {
    const b = e.target.closest(".chip");
    if (!b) return;
    area = b.dataset.a;
    filtros.querySelectorAll(".chip").forEach((x) => x.setAttribute("aria-pressed", x === b));
    const u = new URL(location);
    area === "Todos" ? u.searchParams.delete("area") : u.searchParams.set("area", area);
    history.replaceState(null, "", u);
    render();
  });
  document.getElementById("q").addEventListener("input", (e) => { termo = e.target.value; render(); });
  render();
</script>
</body>
</html>
